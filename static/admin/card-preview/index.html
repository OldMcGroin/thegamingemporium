<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;padding:25px;background:#080d18;color:white;font-family:system-ui}.game-card{max-width:340px;margin:0 auto;border-radius:12px;overflow:hidden;background:#141c2c;border:1px solid #31405c}.game-card__image{height:245px;background:#101729}.game-card__img{height:100%;width:100%;object-fit:cover}.game-card__body{padding:14px}.game-card__title{margin:0 0 12px;font-size:19px}.pill{display:inline-block;background:#273952;padding:5px 9px;border-radius:8px;margin:3px;font-size:12px}.game-card__link{color:inherit;text-decoration:none}</style></head><body><div class="game-card"><a class="game-card__link" href="#"><div class="game-card__image"><img class="game-card__img" id="img" alt="Game artwork"></div><div class="game-card__body"><h3 class="game-card__title" id="title">Preview</h3><div id="meta"></div></div></a></div><script>window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='TGE_CARD_PREVIEW_V1')return;const g=e.data.game||{};document.getElementById('title').textContent=g.title||'Untitled';const meta=document.getElementById('meta');meta.replaceChildren();for(const value of [g.genre1,g.genre2,g.platform].filter(Boolean)){const span=document.createElement('span');span.className='pill';span.textContent=value;meta.append(span)}const img=document.getElementById('img');img.src=g.imageData||g.image||'/Images/Games/'+String(g.title||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.webp';img.onerror=()=>{img.onerror=null;img.src='/Images/placeholder.jpg'}});</script></body></html>
