<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TGE Collection Image Fitter</title><style>body{background:#15151a;color:#eee;font:16px system-ui;max-width:820px;margin:35px auto;padding:16px}label{display:block;margin:15px 0}select,input,button{font:inherit;padding:9px;border-radius:8px}canvas{display:block;max-width:100%;height:auto;margin:20px 0;border:1px solid #555}button{background:#ffd000;cursor:pointer;border:0}small{color:#bbb}</style><h1>Collection Image Fitter</h1><p>Choose an image, select how it fits, then save a 600 × 900 WebP file. Everything happens locally in your browser.</p><label>Artwork <input id="file" type="file" accept="image/*"></label><label>Image fit <select id="mode"><option value="contain">Show full image (blurred background)</option><option value="cover">Fill canvas (crop edges)</option></select></label><label>Filename slug <input id="slug" value="bloodborne-collection"></label><canvas id="canvas" width="600" height="900"></canvas><button id="save" disabled>Save WebP image</button><p><small>Copy the saved .webp file into static/Images/Games/ in your website folder. The website uses the same slug as the filename.</small></p><script>const file=document.getElementById('file'),mode=document.getElementById('mode'),slug=document.getElementById('slug'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),save=document.getElementById('save');let img=null;function draw(){if(!img)return;const W=600,H=900,iw=img.naturalWidth,ih=img.naturalHeight;ctx.clearRect(0,0,W,H);if(mode.value==='contain'){const s=Math.max(W/iw,H/ih),w=iw*s,h=ih*s;ctx.save();ctx.filter='blur(32px) brightness(0.55)';ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);ctx.restore();const k=Math.min(W/iw,H/ih);ctx.drawImage(img,(W-iw*k)/2,(H-ih*k)/2,iw*k,ih*k)}else{const k=Math.max(W/iw,H/ih);ctx.drawImage(img,(W-iw*k)/2,(H-ih*k)/2,iw*k,ih*k)}}file.addEventListener('change',()=>{const f=file.files[0];if(!f)return;const url=URL.createObjectURL(f);const i=new Image();i.onload=()=>{img=i;draw();save.disabled=false;URL.revokeObjectURL(url)};i.src=url});mode.addEventListener('change',draw);save.addEventListener('click',()=>{if(!img)return;canvas.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(slug.value.trim()||'collection-image')+'.webp';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/webp',0.92)})</script></html>
