{{ define "main" }}
<section class="suggestions-admin" data-ai-admin>
<div class="suggestions-admin__head"><div><h1>AI Usage Reports</h1><p>Review evidence before assigning a classification in Preview Mode.</p><a href="/admin/suggestions/">Suggestion Inbox</a></div><strong data-ai-count></strong></div>
<div class="suggestions-tabs"><button type="button" class="is-active" data-status="new">New</button><button type="button" data-status="reviewed">Reviewed</button><button type="button" data-status="all">All</button></div>
<p data-ai-admin-message aria-live="polite"></p><div class="suggestions-list" data-ai-list></div>
</section>
{{ $js := resources.Get "js/admin-ai-reports.js" | minify | fingerprint }}<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" crossorigin="anonymous" defer></script>
{{ end }}
